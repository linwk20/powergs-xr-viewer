<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>XR Blocks PowerGS Viewer</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at top, #202b44 0%, #090c14 42%, #020304 100%);
        font-family:
          "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      xb-blocks-loading-spinner {
        background: transparent !important;
      }

      #xr-launcher {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
      }

      #xr-launch-button {
        pointer-events: auto;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: rgba(8, 13, 23, 0.88);
        color: #f6fbff;
        font: 600 14px/1 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: 0.08em;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
      }

      #xr-launch-button:hover {
        background: rgba(23, 40, 68, 0.94);
      }

      #xr-launch-status {
        min-height: 1.2em;
        max-width: 260px;
        color: rgba(226, 236, 249, 0.92);
        font: 500 12px/1.35 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: right;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transition: opacity 140ms ease;
      }

      #xr-launch-status[data-visible="true"] {
        opacity: 1;
      }

      #xr-launch-status[data-error="true"] {
        color: #ffb9b9;
      }

    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.182.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
          "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
          "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
          "bidi-js": "https://esm.sh/bidi-js@^1.0.2?target=es2022",
          "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
          "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.1/index.js",
          "lit/": "https://cdn.jsdelivr.net/npm/lit@3.3.1/",
          "lit-element": "https://cdn.jsdelivr.net/npm/lit-element@4.2.1/index.js",
          "lit-element/": "https://cdn.jsdelivr.net/npm/lit-element@4.2.1/",
          "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@3.3.1/lit-html.js",
          "lit-html/": "https://cdn.jsdelivr.net/npm/lit-html@3.3.1/",
          "@lit/reactive-element": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.1/reactive-element.js",
          "@lit/reactive-element/": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.1/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "uiblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/addons/uiblocks/src/index.js",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="xr-launcher">
      <button id="xr-launch-button" type="button">ENTER XR</button>
      <div id="xr-launch-status" aria-live="polite"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
